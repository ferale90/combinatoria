name: Compila eseguibili

# Si avvia a mano dalla scheda "Actions" oppure quando pubblichi una release
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # serve per allegare i file alla release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
            modo: --onefile
          - os: ubuntu-latest
            nome: linux
            modo: --onefile
          - os: macos-latest        # Mac con chip Apple (M1, M2, ...)
            nome: macos
            modo: --onedir
          - os: macos-15-intel      # Mac con processore Intel
            nome: macos-intel
            modo: --onedir
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Determina la versione
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            V="${{ github.event.release.tag_name }}"
            V="${V#v}"                       # v1.2.0 -> 1.2.0
          else
            V="dev-${GITHUB_SHA::7}"         # avvio manuale: dev + commit
          fi
          echo "VERSIONE=$V" >> "$GITHUB_ENV"

      - name: Installa le dipendenze
        run: pip install pyinstaller matplotlib

      - name: Compila
        run: pyinstaller --windowed ${{ matrix.modo }} --name Combinatoria combinatoria.py

      - name: Prepara i file da distribuire
        run: |
          N=Combinatoria-$VERSIONE-${{ matrix.nome }}
          case "${{ runner.os }}" in
            Windows)
              cp dist/Combinatoria.exe $N.exe                  # eseguibile diretto
              7z a $N.zip ./dist/Combinatoria.exe              # archivio compresso
              ;;
            Linux)
              cp dist/Combinatoria $N                          # eseguibile diretto
              tar -czf $N.tar.gz -C dist Combinatoria          # archivio (conserva i permessi)
              ;;
            macOS)
              # immagine disco con l'app e il collegamento ad Applicazioni
              mkdir dmg
              cp -R dist/Combinatoria.app dmg/
              ln -s /Applications dmg/Applications
              hdiutil create -volname Combinatoria -srcfolder dmg -ov -format UDZO $N.dmg
              # archivio compresso dell'app
              ditto -c -k --keepParent dist/Combinatoria.app $N.zip
              ;;
          esac

      - name: Carica tra gli artefatti
        uses: actions/upload-artifact@v6
        with:
          name: Combinatoria-${{ env.VERSIONE }}-${{ matrix.nome }}
          path: Combinatoria-${{ env.VERSIONE }}-${{ matrix.nome }}*

      - name: Allega alla release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Combinatoria-${{ env.VERSIONE }}-${{ matrix.nome }}*
