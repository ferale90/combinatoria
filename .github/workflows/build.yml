name: Compila eseguibili

# Si avvia a mano dalla scheda "Actions" oppure quando pubblichi una release
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # serve per allegare i file alla release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: windows
            modo: --onefile
          - os: ubuntu-latest
            nome: linux
            modo: --onefile
          - os: macos-latest        # Mac con chip Apple (M1, M2, ...)
            nome: macos-apple-silicon
            modo: --onedir
          - os: macos-15-intel      # Mac con processore Intel
            nome: macos-intel
            modo: --onedir
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: pip install pyinstaller matplotlib

      - name: Compila
        run: pyinstaller --windowed ${{ matrix.modo }} --name Combinatoria combinatoria.py

      - name: Prepara il file da distribuire
        run: |
          case "${{ runner.os }}" in
            Windows) cp dist/Combinatoria.exe Combinatoria-${{ matrix.nome }}.exe ;;
            Linux)   cp dist/Combinatoria Combinatoria-${{ matrix.nome }} ;;
            macOS)
              # immagine disco con l'app e il collegamento ad Applicazioni
              mkdir dmg
              cp -R dist/Combinatoria.app dmg/
              ln -s /Applications dmg/Applications
              hdiutil create -volname Combinatoria -srcfolder dmg -ov -format UDZO \
                Combinatoria-${{ matrix.nome }}.dmg
              ;;
          esac

      - name: Carica tra gli artefatti
        uses: actions/upload-artifact@v6
        with:
          name: Combinatoria-${{ matrix.nome }}
          path: Combinatoria-${{ matrix.nome }}*

      - name: Allega alla release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Combinatoria-${{ matrix.nome }}*
